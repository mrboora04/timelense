<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TimeLens</title><link rel="stylesheet" href="styles.css"></head>
<body class="panel">
<!-- Stat-Led (designing-layouts/structural-variety): the number first, then now + drift;
     everything else collapsed (guiding-users: progressive disclosure). -->
<header id="mascot" class="lens-line"></header>

<main>
  <section class="hero" aria-labelledby="todayLabel">
    <div class="hero-top">
      <h1 id="todayLabel" class="eyebrow">Browsed today</h1>
      <div id="spark"></div>
    </div>
    <p class="display" id="todayTotal">0m</p>
    <p class="meta" id="trend"></p>
    <div class="stack" id="catStack"></div>
    <p class="legend" id="catLegend"></p>
  </section>

  <section id="nowBox" aria-label="Current site"></section>

  <section aria-labelledby="driftLabel">
    <h2 id="driftLabel" class="eyebrow">Drift</h2>
    <div class="path" id="pathStrip"></div>
    <div class="path-labels" id="pathLabels"></div>
    <p id="driftSum" class="drift-sum"></p>
    <details id="driftMore"><summary>All drifts today</summary><ol id="driftList" class="timeline"></ol></details>
  </section>

  <details class="more">
    <summary>Sites <span class="meta" id="sitesCount"></span></summary>
    <ul id="siteRows" class="rows"></ul>
  </details>
  <details class="more">
    <summary>Categories &amp; targets</summary>
    <ul id="catRows" class="rows"></ul>
    <button id="addCat" class="quiet">Add a category</button>
  </details>
  <details class="more">
    <summary>Challenges <span class="meta" id="challengeState"></span></summary>
    <div id="challengeBox"></div>
  </details>
  <details class="more">
    <summary>Patterns</summary>
    <ul id="insights" class="insights"></ul>
    <h3 class="eyebrow">Active hours today</h3>
    <div id="hours" class="bars"></div><div class="bar-labels" id="hourLabels"></div>
    <h3 class="eyebrow">Last 7 days</h3>
    <div id="week" class="bars"></div><div class="bar-labels" id="weekLabels"></div>
  </details>
  <details class="more">
    <summary>History <span class="meta">last 7 days</span></summary>
    <ul id="histRows" class="rows"></ul>
  </details>
</main>

<footer class="foot">
  <button id="exportBtn" class="quiet">Export data</button>
  <button id="resetBtn" class="quiet danger">Delete all data</button>
  <span id="ver" class="meta"></span>
</footer>

<script src="lib.js"></script>
<script src="lens.js"></script>
<script src="ui.js"></script>
<script src="panel.js"></script>
</body></html>
