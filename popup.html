<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TimeLens</title><link rel="stylesheet" href="styles.css"></head>
<body class="pop">
  <div id="staleNote" class="notice" role="alert" hidden>
  <p>TimeLens was updated but is still running the old version in the background, so tracking may be wrong.</p>
  <button id="reloadBtn" class="primary">Reload TimeLens</button>
  </div>
  <header id="pMascot" class="lens-line"></header>
  <main>
    <section class="hero" aria-labelledby="pLabel">
      <h1 id="pLabel" class="eyebrow">Browsed today</h1>
      <p class="display" id="pTotal">…</p>
      <div class="stack" id="pStack"></div>
      <p class="legend" id="pLegend"></p>
    </section>
    <section id="pNow" aria-label="Current site"></section>
  </main>
  <button id="openPanel" class="primary">Open dashboard</button>
<script src="lib.js"></script>
<script src="lens.js"></script>
<script src="ui.js"></script>
<script src="popup.js"></script>
</body></html>
